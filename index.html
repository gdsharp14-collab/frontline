<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warsea Conquest</title>
<style>
:root{--bg:#0e141b;--panel:#151e28;--panel2:#1d2935;--line:#2a3846;--text:#e9eef3;--muted:#8fa0b2;--accent:#f2c14e;--danger:#d9533f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}
#top{padding:7px 10px 7px;background:var(--panel);border-bottom:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:8px}
#ti{flex:1;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.rd{color:var(--muted);font-size:13px}
#net{font-size:12px;color:#ffb3a6}
.scores{display:flex;gap:6px;margin-top:6px}
.sc{flex:1;display:flex;align-items:center;gap:5px;background:var(--panel2);border-radius:6px;padding:4px 7px;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.sc i{width:10px;height:10px;border-radius:2px;flex:none}
.sc b{margin-left:auto}
.sc em{font-style:normal;color:var(--muted);min-width:10px;text-align:center}
.sc.as{box-shadow:inset 0 0 0 1.5px var(--accent)}
.sc.out{opacity:.45}
#mapwrap{flex:1;min-height:0;position:relative;background:#10283d}
#map{width:100%;height:100%;display:block;touch-action:none}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;min-height:0;padding:0;border-radius:10px;font-size:20px;background:rgba(21,30,40,.85)}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:9px 12px calc(10px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto}
.msg{font-size:16px;margin-bottom:4px}.msg.sm{font-size:14.5px}
.msg.big{font-size:19px;text-align:center;padding:6px 0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 4px}
.info{font-size:12.5px;color:#c9d4df;background:var(--panel2);border-radius:8px;padding:6px 9px;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row>button{flex:1}
.lbl{color:var(--muted);font-size:13px;margin-right:2px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
button:disabled{opacity:.38}
button.primary{background:var(--accent);color:#1a1300;border-color:transparent;font-weight:700}
button.danger{background:var(--danger);color:#fff;border-color:transparent;font-weight:700}
button.ghost{background:transparent;border-color:transparent;min-height:40px;padding:6px 10px;font-size:18px}
.row>button.chip{flex:0 0 auto;min-width:50px;padding:8px 12px;min-height:40px}
button.chip.on{background:#fff;color:#111;font-weight:700;border-color:#fff}
.chip .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.uchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin:2px -2px 0}
.uchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;min-height:0;font-size:13px;border-radius:9px}
.uchip small{color:var(--muted);font-size:11px}
.uchip .usy{font-size:11px;opacity:.7}
.uchip.ord{border-color:#7f6a2a}
.uchip.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.uchip.on small{color:#4a3b06}
.ins{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:#d6dee6}
.rp button{font-size:17px}
.rpt{color:#d6dee6;min-height:36px}
#toast{position:fixed;left:50%;top:92px;transform:translate(-50%,-8px);background:rgba(0,0,0,.85);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.18s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#overlay{position:fixed;inset:0;background:rgba(5,8,12,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#overlay.hidden{display:none}
#overlay.full{background:var(--bg);align-items:stretch}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
#overlay.full .sheet{max-height:none;border-radius:0;height:100%;background:var(--bg)}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h h2{margin:0;font-size:19px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.crow,.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.crow .sw{width:12px;height:12px;border-radius:3px;flex:none}
.crow .cn,.prow .pn{flex:1}
.crow .cm,.prow .pm{color:var(--muted);font-size:12.5px}
.prow.out{opacity:.45;text-decoration:line-through}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.me{font-size:11px;color:#1a1300;background:var(--accent);border-radius:4px;padding:1px 5px;font-weight:700}
.log{max-height:34vh;overflow:auto}
.ll{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.ll .dot{margin-top:3px;width:9px;height:9px}
.ll .r{color:var(--muted);min-width:28px}
table.key{border-collapse:collapse;font-size:13px;width:100%}
table.key td,table.key th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
table.key th{color:var(--muted);font-weight:600}
.setup h1{margin:6px 0 0;font-size:26px;letter-spacing:.14em;color:var(--accent);font-weight:800}
.setup label.h{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.pname{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left-width:6px;background:var(--panel2);color:var(--text);margin-bottom:6px;-webkit-user-select:text;user-select:text}
#prev{width:100%;height:42vh;display:block;margin-top:10px;background:#10283d;border-radius:10px}
.seat{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;text-align:left;border-left:6px solid var(--pc)}
.linkbox{width:100%;font:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);-webkit-user-select:all;user-select:all}
.grow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.grow span{flex:1}
.center{text-align:center}
.fatal{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px;width:100%}
.fatal code{color:var(--muted);font-size:12px;word-break:break-all}
/* map */
polygon.sea{fill:#132f48;stroke:#ffffff;stroke-opacity:.04;stroke-width:.5}
polygon.land{stroke:rgba(0,0,0,.25);stroke-width:.35}
.g-mtn{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.75;stroke-linejoin:round;pointer-events:none}
.g-swp{fill:none;stroke:rgba(170,230,210,.55);stroke-width:.65;pointer-events:none}
.g-urb{fill:rgba(255,255,255,.42);pointer-events:none}
.b-own{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.55;stroke-dasharray:1.2 1;pointer-events:none}
.b-cty{fill:none;stroke:#05080b;stroke-width:1.5;stroke-linecap:round;pointer-events:none}
.b-coast{fill:none;stroke:#cfe6f7;stroke-opacity:.55;stroke-width:.9;stroke-linecap:round;pointer-events:none}
.marks{pointer-events:none}
.m-fcap{fill:#f2c14e;stroke:#3a2c00;stroke-width:.4}
.m-cap{fill:#fff;stroke:#111;stroke-width:.5}
.m-port{font-size:4.6px;text-anchor:middle;fill:#cfe6f7}
.clabel{display:none;font-size:3.3px;text-anchor:middle;fill:rgba(255,255,255,.8);font-weight:600;letter-spacing:.04em;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:.7px}
#map.zoomed .clabel{display:block}
.reach{fill:rgba(242,193,78,.16);stroke:#f2c14e;stroke-width:.7;pointer-events:none}
.plans{pointer-events:none}
.plan{fill:none;stroke:#f2c14e;stroke-width:1.2;stroke-dasharray:2.2 1.4;stroke-linecap:round;stroke-linejoin:round}
.pnum circle{fill:#f2c14e;stroke:#1a1300;stroke-width:.3}
.pnum text{font-size:2.9px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#1a1300}
.unitsG{pointer-events:none}
.unit{transition:transform .45s ease}
.unit .ub{stroke:#fff;stroke-width:.55}
.unit.sel .ub{stroke:#f2c14e;stroke-width:1.3}
.usym{fill:none;stroke:#fff;stroke-width:.6}
.fx{pointer-events:none}
.hpbg{fill:rgba(0,0,0,.55)}
.hpbar{fill:#5ad16b}
.dmgn{font-size:4.2px;font-weight:800;text-anchor:middle;fill:#ff8a73;paint-order:stroke;stroke:#000;stroke-width:.8px}
.uchip.inb{border-color:#b3261e}
.m-res{font-size:4.2px;text-anchor:middle}
.qb{font-size:3.6px;font-weight:800;text-anchor:middle;fill:#f2c14e;paint-order:stroke;stroke:#000;stroke-width:.7px}
.stackn{font-size:3.6px;font-weight:800;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.8px}
.eco{gap:6px}.eco .cur{display:inline-flex;align-items:baseline;gap:2px;background:var(--panel2);border-radius:7px;padding:4px 7px;font-size:13px}
.eco .cur small{color:#7fd38a;font-size:11px}
.eco>button.chip{margin-left:auto;min-height:34px;padding:5px 10px}
.brow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.brow>span{flex:1}.brow small{color:var(--muted)}
.brow.off{opacity:.55}.brow .chip{min-height:0;padding:6px 9px;font-size:13px;line-height:1.2}
.clash{font-size:5px;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#b3261e;stroke-width:1.4px}
</style>

<script type="module">
// ---- Firebase connection (loaded from Google) ----
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCnCTuIaylYTKa14l6LEvEV9wUmzwoMutU",
  authDomain: "frontline-game-cf9e5.firebaseapp.com",
  projectId: "frontline-game-cf9e5",
  storageBucket: "frontline-game-cf9e5.firebasestorage.app",
  messagingSenderId: "562998491724",
  appId: "1:562998491724:web:09e7f06c54c35804c212e9"
};

let app, auth, db;
window.FBBackend = {
  async init() {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    const existing = await new Promise((res, rej) => { const un = onAuthStateChanged(auth, u => { un(); res(u); }, rej); });
    if (existing) return existing.uid;
    const cred = await signInAnonymously(auth);
    return cred.user.uid;
  },
  async load(id) {
    const s = await getDoc(doc(db, "games", id));
    return s.exists() ? s.data() : null;
  },
  async tx(id, fn) {
    const ref = doc(db, "games", id);
    return runTransaction(db, async t => {
      const s = await t.get(ref);
      const next = fn(s.exists() ? s.data() : null);
      if (!next) return false;
      t.set(ref, next);
      return true;
    });
  },
  watch(id, cb, onErr) {
    return onSnapshot(doc(db, "games", id), s => cb(s.exists() ? s.data() : null), e => { console.error(e); if (onErr) onErr(e); });
  }
};
window.dispatchEvent(new Event("fbready"));
</script>
<script>
'use strict';
// ================= constants =================
const S=10, SQ3=Math.sqrt(3), NS='http://www.w3.org/2000/svg';
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]]; // neighbour k sits across hex edge k (corners k..k+1)
const GRID={cols:21,rows:23};
const NEUTRALS_PER_PAIR=2;
const NF=3, MAX_TURNS=50, ORDER_LIMIT=3;
const PCOL=[{name:'Red',h:4},{name:'Blue',h:214},{name:'Green',h:140}];
const UNIT={
  inf:{name:'Infantry',type:'Infantry',short:'Inf',mp:3,aoc:0,str:2,hp:10,cost:{m:8}},
  arm:{name:'Armoured',type:'Armour',short:'Armd',mp:5,aoc:1,str:4,hp:12,cost:{m:14,s:2,o:2,r:1}}
};
// ---- economy settings (stage 3) ----
const CUR={m:{name:'Money',icon:'💰'},s:{name:'Steel',icon:'⚙'},o:{name:'Oil',icon:'🛢'},r:{name:'Rubber',icon:'🌿'}};
const RES={fac:{name:'Factory',icon:'🏭',gives:'m',amt:2},oil:{name:'Oil field',icon:'🛢',gives:'o',amt:2},stl:{name:'Mine',icon:'⛏',gives:'s',amt:2},rub:{name:'Rubber plantation',icon:'🌿',gives:'r',amt:2}};
const CAPITAL_MONEY=1;                    // every country capital also produces this much Money
const START_RES={m:16,s:2,o:2,r:1};       // each faction's starting stockpile
// ---- combat settings (stage 2) ----
const TERRAIN_BONUS=0.5;      // +50% strength: armour on plains; infantry vs armour in mountains or urban
const DMG_SPREAD=[0.5,1.5];   // each hit deals strength x a random factor in this range (rounded, minimum 1)
const RETREAT_FRAC=0.5;       // retreating units get this share of their movement points (rounded down)
const MIN_BATTLE_STEPS=6;     // while any battle is going, a turn lasts at least this many steps
// movement points needed to ENTER a hex of each terrain
const COST={inf:{P:1,U:1,M:2,S:2},arm:{P:1,U:1,M:2,S:3}};
const TERR={P:'Plains',M:'Mountains',U:'Urban',S:'Swamp'};
const SYL=['ka','ro','vel','dun','mar','sil','tor','bra','en','ost','gal','ny','hal','ver','ash','kel','mor','ith','lan','zar','fen','dor','sha','bel','tir','ul','gor','ri','cas','vor','pol','stav','kur','lein','mir','tal'];
const CEND=['ia','os','ar','and','ica','ea','heim','avia','istan','onia','mark','land'];

// ================= helpers =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const newSeed=()=>Math.floor(Math.random()*2147483647);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
function hexDist(M,a,b){const A=M.cells[a],B=M.cells[b],dq=A.q-B.q,dr=A.r-B.r;return(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2}
function stepCost(M,u,to){const c=M.cells[to];if(!c||!c.l)return null;return COST[u.t][c.t]}

// ================= world generation =================
function genWorld(seed){
  for(let a=0;a<120;a++){const w=tryWorld(seed,a);if(w){w.seed=seed;return w}}
  return null;
}
function tryWorld(seed,attempt){
  const rnd=mulberry32((seed+attempt*1000003)>>>0), ri=n=>Math.floor(rnd()*n);
  const {cols,rows}=GRID, cells=[], idx=new Map(), K=(q,r)=>q*1000+r;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const q=col-((row-(row&1))>>1); idx.set(K(q,row),cells.length);
    cells.push({q,r:row,col,row,x:+(S*SQ3*(col+0.5*(row&1))).toFixed(2),y:S*1.5*row,w:rnd(),m:rnd(),s:rnd(),c:-1,t:'',port:0,cap:-1,nb:null});
  }
  cells.forEach(c=>c.nb=DIRS.map(([dq,dr])=>{const j=idx.get(K(c.q+dq,c.r+dr));return j===undefined?-1:j}));
  const NB=i=>cells[i].nb.filter(j=>j>=0);
  for(const key of ['w','m','s'])for(let k=0;k<3;k++){const nv=cells.map((c,i)=>{let s=c[key],n=1;for(const j of NB(i)){s+=cells[j][key];n++}return s/n});nv.forEach((v,i)=>cells[i][key]=v)}
  const edge=c=>c.row<1||c.row>rows-2||c.col<1||c.col>cols-2;
  const hd=(a,b)=>{const A=cells[a],B=cells[b],dq=A.q-B.q,dr=A.r-B.r;return(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2};
  const center=Math.floor(rows/2)*cols+Math.floor(cols/2);
  const nearest=(x,y)=>{let b=-1,bd=1e9;cells.forEach((c,i)=>{if(edge(c)||c.c>=0)return;const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;b=i}});return b};
  const C=[];
  const addCountry=(f,L,seedCell,target)=>{const id=C.length;C.push({f,L,target,cells:[seedCell]});cells[seedCell].c=id;return id};
  // three large home countries arranged in a rough triangle
  const a0=rnd()*Math.PI*2, Rr=(4.7+rnd()*0.7)*S*SQ3;
  for(let f=0;f<NF;f++){const a=a0+f*2*Math.PI/3;addCountry(f,1,nearest(cells[center].x+Rr*Math.cos(a),cells[center].y+Rr*Math.sin(a)),15+ri(6))}
  // neutral countries seeded in the gaps between each pair of factions
  const neutralIds=[];
  for(let a=0;a<NF;a++){const b=(a+1)%NF,A=cells[C[a].cells[0]],Bc=cells[C[b].cells[0]];
    const mx=(A.x+Bc.x)/2,my=(A.y+Bc.y)/2,dx=Bc.x-A.x,dy=Bc.y-A.y,L=Math.hypot(dx,dy)||1,px=-dy/L,py=dx/L;
    for(let k=0;k<NEUTRALS_PER_PAIR;k++){const off=(k-(NEUTRALS_PER_PAIR-1)/2)*2.6*S*SQ3+(rnd()-0.5)*S;
      const seed=nearest(mx+px*off,my+py*off);if(seed<0)return null;neutralIds.push(addCountry(-1,0,seed,8+ri(5)))}}
  const frontier=id=>{const s=new Set();for(const i of C[id].cells)for(const j of NB(i))if(cells[j].c<0&&!edge(cells[j]))s.add(j);return[...s]};
  const grow=(ids,biased)=>{
    let act=ids.slice();
    while(act.length){
      for(const id of act.slice()){
        const k=C[id]; if(k.cells.length>=k.target){act=act.filter(x=>x!==id);continue}
        const fr=frontier(id); if(!fr.length)return false;
        let best=-1,bs=-1e9;
        for(const j of fr){let sc=NB(j).filter(n=>cells[n].c===id).length*1.1+cells[j].w*2.5+rnd()*0.9;if(biased&&biased.has(id))sc-=hd(j,center)*0.22;if(sc>bs){bs=sc;best=j}}
        cells[best].c=id;k.cells.push(best);
      }
    }
    return true;
  };
  if(!grow([0,1,2,...neutralIds],new Set([0,1,2])))return null;
  // two small countries attached to each home country
  for(let f=0;f<NF;f++)for(let k=0;k<2;k++){
    const fr=frontier(f).filter(j=>NB(j).every(n=>cells[n].c<0||C[cells[n].c].f===f));
    if(!fr.length)return null;
    addCountry(f,0,fr[ri(fr.length)],8+ri(5));
  }
  if(!grow(C.map((k,i)=>i).filter(i=>C[i].f>=0&&!C[i].L),null))return null;
  // enclosed lakes become land of the neighbouring country
  const ocean=new Set(),st=[];cells.forEach((c,i)=>{if(edge(c)){ocean.add(i);st.push(i)}});
  while(st.length){const x=st.pop();for(const y of NB(x))if(cells[y].c<0&&!ocean.has(y)){ocean.add(y);st.push(y)}}
  for(let pass=0;pass<6;pass++){let any=false;cells.forEach((c,i)=>{if(c.c>=0||ocean.has(i))return;const cnt={};NB(i).forEach(n=>{if(cells[n].c>=0)cnt[cells[n].c]=(cnt[cells[n].c]||0)+1});const ks=Object.keys(cnt);if(!ks.length)return;const b=+ks.sort((a,b)=>cnt[b]-cnt[a])[0];c.c=b;C[b].cells.push(i);any=true});if(!any)break}
  const land=cells.map((c,i)=>i).filter(i=>cells[i].c>=0);
  // all land must be connected; every neutral country must border a faction, and each pair of factions must have a neutral between them
  {const seen=new Set([land[0]]),q=[land[0]];while(q.length){const x=q.pop();for(const y of NB(x))if(cells[y].c>=0&&!seen.has(y)){seen.add(y);q.push(y)}}if(seen.size!==land.length)return null}

// ================= game setup =================
function newGame(map,opts){

  const units=[]; let nid=1;
  for(let f=0;f<NF;f++){
    const cap=map.factions[f].cap;
    const home=map.cells[cap].nb.filter(j=>j>=0&&map.cells[j].l&&map.cells[j].c===f);
    const spots=[cap,...home.slice(0,3)]; while(spots.length<4)spots.push(cap);
    units.push({id:nid++,f,t:'inf',hp:UNIT.inf.hp,c:spots[0],name:'1st Infantry'});
    units.push({id:nid++,f,t:'inf',hp:UNIT.inf.hp,c:spots[1],name:'2nd Infantry'});
    units.push({id:nid++,f,t:'inf',hp:UNIT.inf.hp,c:spots[2],name:'3rd Infantry'});
    units.push({id:nid++,f,t:'arm',hp:UNIT.arm.hp,c:spots[3],name:'1st Armoured'});

    orders:players.map(()=>[]),submitted:players.map(()=>false),limit:players.map(()=>ORDER_LIMIT),
    replay:null,log:[{t:0,f:-1,m:'The war begins.'}],winners:null,cpu,links:[],
    res:players.map(()=>({...START_RES})),builds:players.map(()=>[]),cnt:players.map(()=>({inf:3,arm:1})),inc:players.map(()=>null)};
}
const landCount=(g,f)=>g.owner.reduce((s,o,i)=>s+(o===f&&g.map.cells[i].l?1:0),0);

const linkKey=(a,b)=>Math.min(a,b)+'-'+Math.max(a,b);

    const A=g.units[a],B=g.units[b]; if(A.f===B.f)continue;
    if(hexDist(g.map,A.c,B.c)<=Math.max(UNIT[A.t].aoc,UNIT[B.t].aoc)||L.has(linkKey(A.id,B.id)))out.push([A,B]);

const inContact=(M,a,b)=>a.f!==b.f&&hexDist(M,a.c,b.c)<=Math.max(UNIT[a.t].aoc,UNIT[b.t].aoc);

const hpOf=u=>u.hp==null?maxHp(u):u.hp;

// ================= economy =================
function ensureEco(g){
  if(!g.res)g.res=g.players.map(()=>({...START_RES}));
  if(!g.builds)g.builds=g.players.map(()=>[]);
  if(!g.inc)g.inc=g.players.map(()=>null);
  if(!g.cnt)g.cnt=g.players.map((p,f)=>({inf:g.units.filter(u=>u.f===f&&u.t==='inf').length+3,arm:g.units.filter(u=>u.f===f&&u.t==='arm').length+3}));

const blockaded=(g,port)=>false; // stage 4: an enemy naval unit next to the port

function supplyNet(g,f){

// ================= carrying out orders =================
function resolveTurn(g){

// groups of hexes completely surrounded by one other faction switch to it (except capitals, or if units are inside)

    if(u.c===cap||fightOdds(u,u.c,foes)>=1||orders.length>=lim)continue;

  const threat=enemies.some(e=>hexDist(M,e.c,cap)<=UNIT[e.t].mp+1);

function aiBuilds(g,f){

function applyView(){

// ================= orders (drafts) =================
const dkey=f=>`wc.d.${GID}.${G.turn}.${f}`;
function getDraft(f){
  if(!DRAFT[f]){
    const src=G.submitted[f]?G.orders[f]:LS.get(dkey(f),[]);
    DRAFT[f]=(src||[]).filter(x=>x&&x.path&&x.path.length&&G.units.some(u=>u.id===x.u&&u.f===f)).map(x=>x.r?{u:x.u,path:x.path.slice(),r:true}:{u:x.u,path:x.path.slice()});
  }
  return DRAFT[f];
}
function saveDraft(f){LS.set(dkey(f),getDraft(f))}
let BLD={};
function getBuilds(f){
  if(!BLD[f]){const src=G.submitted[f]?(G.builds&&G.builds[f]):LS.get(dkey(f)+'.b',[]);BLD[f]=(src||[]).filter(b=>b&&UNIT[b.t]&&G.map.cells[b.c]).map(b=>({c:b.c,t:b.t}))}
  return BLD[f];
}
function saveBuilds(f){LS.set(dkey(f)+'.b',getBuilds(f))}
const costStr=c=>Object.keys(c).map(k=>`${c[k]}${CUR[k].icon}`).join(' ');
function afterBuilds(f){const left={...((G.res&&G.res[f])||START_RES)};getBuilds(f).forEach(b=>Object.keys(UNIT[b.t].cost).forEach(k=>left[k]-=UNIT[b.t].cost[k]));return left}
function ecoHTML(f){
  const st=(G.res&&G.res[f])||START_RES,inc=incomeOf(G,f),left=afterBuilds(f),nb=getBuilds(f).length;
  return Object.keys(CUR).map(k=>`<span class="cur" title="${CUR[k].name}">${CUR[k].icon}<b>${nb?left[k]:st[k]}</b><small>+${inc[k]}</small></span>`).join('');
}
const mpFor=(u,E)=>E.has(u.id)?retreatMp(u.t):UNIT[u.t].mp;
function planInfo(f){
  const d=getDraft(f),pos={},used={},labels=[],segs=[],E=engagedSet(G);
  G.units.filter(u=>u.f===f).forEach(u=>{pos[u.id]=u.c;used[u.id]=0});
  let n=0;
  d.forEach(ins=>{const u=G.units.find(x=>x.id===ins.u);const pts=[pos[ins.u]];ins.path.forEach(h=>{used[ins.u]+=COST[u.t][G.map.cells[h].t];labels.push([h,++n]);pts.push(h)});pos[ins.u]=pts[pts.length-1];segs.push(pts)});
  return{pos,used,labels,segs,E,ordered:new Set(d.map(x=>x.u))};
}
function reachFrom(t,start,mp){
  const M=G.map,dist=new Map([[start,0]]),prev=new Map(),open=[start];
  while(open.length){open.sort((a,b)=>dist.get(a)-dist.get(b));const x=open.shift();
    for(const y of M.cells[x].nb){if(y<0||!M.cells[y].l)continue;const nd=dist.get(x)+COST[t][M.cells[y].t];if(nd<=mp&&(!dist.has(y)||nd<dist.get(y))){dist.set(y,nd);prev.set(y,x);if(!open.includes(y))open.push(y)}}}
  return{dist,prev};
}
function pathTo(rr,start,target){const p=[];let x=target;while(x!==start){p.unshift(x);x=rr.prev.get(x)}return p}
const canPlot=()=>!!(G&&G.phase==='orders'&&UI.as!=null&&G.players[UI.as].alive&&G.players[UI.as].uid===ME&&!G.submitted[UI.as]&&!UI.rp&&!UI.busy);
function pickAs(){
  const s=mySeats().filter(f=>G.players[f].alive);
  if(UI.as!=null&&s.includes(UI.as)&&!G.submitted[UI.as])return;
  const open=s.find(f=>!G.submitted[f]);
  UI.as=open!=null?open:(s.includes(UI.as)?UI.as:(s[0]!=null?s[0]:null));
}
function addSteps(f,uid,path){
  const d=getDraft(f),last=d[d.length-1];
  if(UI.seg&&last&&last.u===uid)last.path.push(...path);
  else{const ordered=new Set(d.map(x=>x.u));if(!ordered.has(uid)&&ordered.size>=G.limit[f])return toast(`You can give orders to ${G.limit[f]} units per turn`);d.push(engagedSet(G).has(uid)?{u:uid,path:path.slice(),r:true}:{u:uid,path:path.slice()})}
  UI.seg=true;saveDraft(f);
}
function onCellTap(i){
  if(!G)return;
  UI.info=i;
  if(!canPlot()){render();return}
  const f=UI.as,P=planInfo(f);
  if(UI.sel!=null){
    const u=G.units.find(x=>x.id===UI.sel);
    if(u){const end=P.pos[u.id],left=mpFor(u,P.E)-P.used[u.id];
      if(i!==end){const rr=reachFrom(u.t,end,left);if(rr.dist.has(i)){addSteps(f,u.id,pathTo(rr,end,i));render();return}}}
  }
  const here=G.units.filter(u=>u.f===f&&P.pos[u.id]===i);
  if(here.length){const k=here.findIndex(u=>u.id===UI.sel);const nu=here[(k+1)%here.length];if(UI.sel!==nu.id){UI.sel=nu.id;UI.seg=false}else{UI.sel=null;UI.seg=false}}
  else if(UI.sel!=null)toast('Out of range — tap a highlighted hex, or Done');
  render();
}
async function submitOrders(){
  const f=UI.as,turn=G.turn,d=getDraft(f).map(x=>x.r?{u:x.u,path:x.path.slice(),r:true}:{u:x.u,path:x.path.slice()}),bl=getBuilds(f).map(b=>({c:b.c,t:b.t}));
  UI.busy=true;UI.sel=null;UI.seg=false;render();
  const ok=await mutate(g=>{
    if(g.phase!=='orders'||g.turn!==turn||!g.players[f].alive||g.players[f].uid!==ME)return false;
    g.orders[f]=d;if(!g.builds)g.builds=g.players.map(()=>[]);g.builds[f]=bl;g.submitted[f]=true;
    advance(g);
  });
  UI.busy=false;
  if(!ok)toast("Couldn't submit — the turn may have changed");
  pickAs();render();afterSync();
}
async function editOrders(){
  const f=UI.as,turn=G.turn;
  UI.busy=true;render();
  const ok=await mutate(g=>{if(g.turn!==turn||!g.submitted[f]||g.players[f].uid!==ME)return false;g.submitted[f]=false});
  UI.busy=false;
  if(ok){saveDraft(f);saveBuilds(f)}else toast('Too late — all orders were already in');
  render();

// ================= replay =================
let playT=0;
function stopPlay(){clearInterval(playT);playT=0;if(UI.rp)UI.rp.playing=false}
function startReplay(){LS.set('wc.seen.'+GID,G.replay.turn);UI.rp={i:-1,playing:false};UI.sel=null;hideOverlay();playPause()}
function playPause(){
  if(!UI.rp)return;
  if(UI.rp.playing){stopPlay();render();return}
  const n=G.replay.steps.length;
  if(UI.rp.i>=n)UI.rp.i=-1;
  UI.rp.playing=true;
  playT=setInterval(()=>{if(!UI.rp){stopPlay();return}if(UI.rp.i>=n){stopPlay();render();return}UI.rp.i++;render()},750);
  render();
}
function rpStep(d){if(!UI.rp)return;stopPlay();const n=G.replay.steps.length;UI.rp.i=Math.max(-1,Math.min(n,UI.rp.i+d));render()}
function rpView(){
  const r=G.replay,i=UI.rp.i,pos=new Map(),meta=new Map(),owner=r.so.slice(),gone=new Set();let ct=[];
  const hp=new Map();let dmg=[];
  r.su.forEach(([id,c,f,t,name,h])=>{pos.set(id,c);meta.set(id,{id,f,t,name});hp.set(id,h==null?UNIT[t].hp:h)});
  for(let k=0;k<=Math.min(i,r.steps.length-1);k++){const st=r.steps[k];st.mv.forEach(([u,a,b])=>pos.set(u,b));(st.hp||[]).forEach(([u,h])=>hp.set(u,h));st.fl.forEach(([h,o])=>owner[h]=o);if(k===i){ct=st.ct;dmg=st.dmg||[]}st.gone.forEach(u=>{if(k<i)gone.add(u)})}
  if(i>=r.steps.length){r.end.forEach(([h,o])=>owner[h]=o);r.steps.forEach(st=>st.gone.forEach(u=>gone.add(u)));(r.built||[]).forEach(([id,c,f,t,name,h])=>{pos.set(id,c);meta.set(id,{id,f,t,name});hp.set(id,h)})}
  const units=[];pos.forEach((c,id)=>{if(!gone.has(id))units.push({...meta.get(id),c,hp:hp.get(id)})});
  return{owner,units,ct,pos,meta,dmg};
}
// pairs of units in contact in a replay frame (area of control, plus head-on locks from the current state)
function contactPairsAt(v){
  const out=[],us=v.units;
  for(let a=0;a<us.length;a++)for(let b=a+1;b<us.length;b++){const A=us[a],B=us[b];if(A.f!==B.f&&hexDist(G.map,A.c,B.c)<=Math.max(UNIT[A.t].aoc,UNIT[B.t].aoc))out.push([A.id,B.id])}
  return out;
}
function rpText(v){
  const r=G.replay,i=UI.rp.i,n=r.steps.length,nm=id=>{const m=v.meta.get(id);return m?`${G.players[m.f].name} ${m.name}`:'?'};
  if(i<0)return`Start of turn ${r.turn}. ${n?`${n} step${n>1?'s':''} to play.`:'Nobody moved.'}`;
  if(i>=n){const k=r.end.length,bt=(r.built||[]).map(([id,c,f,t,name])=>`${G.players[f].name} ${name}`);return`End of turn.${k?` ${k} encircled hex${k>1?'es':''} changed hands.`:''}${bt.length?` New units: ${bt.join(', ')}.`:''}`}
  const st=r.steps[i],parts=[];
  st.mv.forEach(([u,a,b])=>parts.push(`${nm(u)} → ${G.map.countries[G.map.cells[b].c].name}`));
  st.ct.forEach(([a,b])=>parts.push(`⚔ Battle: ${nm(a)} vs ${nm(b)}`));
  (st.dmg||[]).forEach(([a,b,d])=>parts.push(`${nm(a)} hits ${nm(b)} −${d}`));
  st.gone.forEach(u=>{if(!st.el.length)parts.push(`💥 ${nm(u)} destroyed`)});
  st.el.forEach(f=>parts.push(`☠ ${G.players[f].name} eliminated`));
  if(!st.mv.length&&!parts.length)parts.push('…');
  return parts.join(' · ');
}

let toastT=0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}
function act(a,ds){
  switch(a){
    case 'selu':{if(!canPlot())return;const id=+ds.id;if(UI.sel===id){UI.sel=null}else{UI.sel=id;const u=G.units.find(x=>x.id===id);if(u)UI.info=planInfo(UI.as).pos[id]}UI.seg=false;render();return}
    case 'done':UI.sel=null;UI.seg=false;render();return;
    case 'openBuild':if(G&&UI.as!=null)openBuild();return;
    case 'build':{if(!canPlot())return;const c=+ds.c,t=ds.t,b=getBuilds(UI.as);if(b.some(x=>x.c===c)||!canAfford(afterBuilds(UI.as),UNIT[t].cost))return;b.push({c,t});saveBuilds(UI.as);openBuild();render();return}
    case 'unbuild':{if(!canPlot())return;const c=+ds.c;BLD[UI.as]=getBuilds(UI.as).filter(x=>x.c!==c);saveBuilds(UI.as);openBuild();render();return}
    case 'undo':{if(!canPlot())return;const d=getDraft(UI.as),last=d[d.length-1];if(!last)return;last.path.pop();if(!last.path.length)d.pop();const nl=d[d.length-1];UI.seg=!!(nl&&nl.u===UI.sel);saveDraft(UI.as);render();return}
    case 'clear':if(!canPlot())return;getDraft(UI.as).length=0;UI.sel=null;UI.seg=false;saveDraft(UI.as);render();return;

    case 'zout':{const r=mapRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4);return}
    case 'zfit':fitView();return;
    case 'replay':if(G&&G.replay)startReplay();return;

    case 'rpNext':rpStep(1);return;
    case 'rpStart':stopPlay();UI.rp.i=-1;render();return;
    case 'rpEnd':stopPlay();UI.rp.i=G.replay.steps.length;render();return;

function render(){
  if(!G||!R)return;
  const M=G.map;
  let owner=G.owner,units=G.units,ct=contactsNow(G).map(([a,b])=>[a.id,b.id]),posOf=id=>{const u=G.units.find(x=>x.id===id);return u?u.c:null},dmg=[];
  if(UI.rp){const v=rpView();owner=v.owner;units=v.units;ct=v.units.length?contactPairsAt(v):[];dmg=v.dmg;posOf=id=>v.pos.get(id)}
  M.cells.forEach((c,i)=>{if(c.l)R.poly[i].style.fill=ownerFill(owner[i],c.t)});
  let d='';M.cells.forEach((c,i)=>{if(!c.l)return;for(let k=0;k<6;k++){const j=c.nb[k];if(j>i&&M.cells[j].l&&owner[j]!==owner[i])d+=edgeSeg(c,k)}});R.own.setAttribute('d',d);

    plan.labels.forEach(([h,n])=>{const c=M.cells[h];const g=el('g',{class:'pnum'},R.paths);el('circle',{cx:c.x+5,cy:c.y-4.2,r:2.3},g);el('text',{x:c.x+5,y:c.y-4.1},g).textContent=n});
  }

  // reachable hexes for the selected unit
  let rd='';
  if(plotting&&canPlot()&&UI.sel!=null){const u=G.units.find(x=>x.id===UI.sel);if(u){const end=plan.pos[u.id],rr=reachFrom(u.t,end,mpFor(u,plan.E)-plan.used[u.id]);rr.dist.forEach((v,h)=>{if(h!==end)rd+=`M${hexPts(M.cells[h]).replace(/ /g,'L')}Z`})}}
  R.reach.setAttribute('d',rd);
  // unit tokens (shown at planned positions while plotting)

  Object.entries(stackN).forEach(([c,n])=>{if(n>3){const cc=M.cells[c];el('text',{x:cc.x+5.6,y:cc.y+1.4,class:'stackn'},R.fx).textContent='×'+n}});
  const dmgAt={};dmg.forEach(([a,b,d])=>{const p=posOf(b);if(p==null)return;const k=dmgAt[p]=(dmgAt[p]||0)+1;const c=M.cells[p];el('text',{x:c.x+3,y:c.y-3.5-k*3.4,class:'dmgn'},R.fx).textContent='−'+d});

      h=`${asRow}<div class="msg">✓ Orders in for turn ${G.turn}.</div>
      <div class="row eco" style="margin-top:2px">${ecoHTML(f)}<button class="chip" data-act="openBuild">🏭 Builds${getBuilds(f).length?` (${getBuilds(f).length})`:''}</button></div>
      <div class="sub">Waiting for ${wait.map(k=>`<b style="color:${pcol(k)}">${esc(G.players[k].name)}</b>${G.players[k].uid?'':' (seat not taken)'}`).join(', ')}. The turn plays out as soon as everyone has submitted.${wait.some(k=>!G.players[k].uid)?' To test on your own, open ☰ Menu → <b>Computer plays open seats</b>.':''}</div>${infoHTML()}
      <div class="row"><button data-act="edit" ${UI.busy?'disabled':''}>Edit my orders</button>${G.replay?'<button data-act="replay">Watch last turn</button>':''}</div>`;
    }else{
      const P=planInfo(f),d=getDraft(f),us=G.units.filter(u=>u.f===f);
      const chips=us.map(u=>{const inB=P.E.has(u.id),mx=mpFor(u,P.E);return`<button class="uchip ${UI.sel===u.id?'on':''} ${P.ordered.has(u.id)?'ord':''} ${inB?'inb':''}" data-act="selu" data-id="${u.id}"><span class="usy">${u.t==='inf'?'✕':'⬭'}${inB?' ⚔ in battle':''}</span>${esc(u.name.replace('Infantry','Inf').replace('Armoured','Armd'))}<small>${hpOf(u)}/${UNIT[u.t].hp} HP · ${mx-P.used[u.id]}/${mx} MP</small></button>`}).join('');
      const selU=UI.sel!=null?us.find(u=>u.id===UI.sel):null,selB=selU&&P.E.has(selU.id);
      const msg=selU?(selB?`<b>${esc(selU.name)}</b> is in battle. It can only <b>retreat</b> (${mpFor(selU,P.E)-P.used[selU.id]} MP left): tap a highlighted hex, or leave it to keep fighting.`
          :`Moving <b>${esc(selU.name)}</b>: tap a highlighted hex (${UNIT[selU.t].mp-P.used[selU.id]} MP left). Tap <b>Done</b> to switch units.`)
        :`Turn ${G.turn} of ${G.maxTurns}: tap a unit to plot its path. Units without orders stay put${P.E.size&&us.some(u=>P.E.has(u.id))?', and units in battle keep fighting':''}.`;
      const list=d.length?`<div class="ins">${d.map((x,k)=>{const u=us.find(z=>z.id===x.u);return`<span>${k+1}. ${esc(u?u.name:'?')} ${x.r?'↩ retreats':'→'} ${x.path.length} hex${x.path.length>1?'es':''}</span>`}).join('')}</div>`:'';
      const nb=getBuilds(f).length;
      h=`${asRow}<div class="msg sm">${msg}</div>
      <div class="row eco" style="margin-top:2px">${ecoHTML(f)}<button class="chip" data-act="openBuild">🏭 Build${nb?` (${nb})`:''}</button></div>
      <div class="uchips">${chips}</div>
      <div class="sub">${P.ordered.size}/${G.limit[f]} units ordered${d.length?` · ${d.reduce((s,x)=>s+x.path.length,0)} steps`:''}</div>${list}${infoHTML()}
      <div class="row">${selU?'<button data-act="done">Done</button>':''}<button data-act="undo" ${d.length?'':'disabled'}>↶ Undo</button><button data-act="clear" ${d.length?'':'disabled'}>Clear</button><button class="primary" data-act="submit" ${UI.busy?'disabled':''}>Submit orders</button></div>`;
    }
  }
  $('panel').innerHTML=h;
}

// ================= overlays =================
function showOverlay(html,cls,name){const o=$('overlay');o.className=cls||'';o.innerHTML=html;o.scrollTop=0;UI.ov=name||'misc'}
function hideOverlay(){const o=$('overlay');o.className='hidden';o.innerHTML='';UI.ov=null;afterSync()}
const logLine=e=>`<div class="ll"><span class="r">T${e.t}</span><span class="dot" style="background:${pcol(e.f)}"></span><span>${esc(e.m)}</span></div>`;
function openReplayPrompt(){
  const r=G.replay,ev=G.log.filter(e=>e.t===r.turn);
  showOverlay(`<div class="sheet"><div class="sh-h"><h2>Turn ${r.turn} has played out</h2><button class="ghost" data-act="skipReplay">✕</button></div>
  ${ev.length?`<div class="log">${ev.map(logLine).join('')}</div>`:'<p class="sub">Nothing much happened.</p>'}
  <div class="row"><button data-act="skipReplay">Skip</button><button class="primary" data-act="replay">▶ Watch replay</button></div></div>`,'','rprompt');
}
function openBuild(){
  const f=UI.as,b=getBuilds(f),edit=canPlot(),left=afterBuilds(f),M=G.map;
  const caps=M.countries.map((k,id)=>({k,id})).filter(({k})=>G.owner[k.cap]===f);
  const rows=caps.map(({k})=>{
    const q=b.find(x=>x.c===k.cap),star=M.factions[f].cap===k.cap?'★ ':'';
    if(q)return`<div class="brow"><span><b>${star}${esc(k.name)}</b><br><small>Queued: ${UNIT[q.t].type}</small></span>${edit?`<button class="chip" data-act="unbuild" data-c="${k.cap}">✕ Cancel</button>`:''}</div>`;
    if(!canBuildAt(G,f,k.cap)){const why=G.units.some(u=>u.c===k.cap&&u.f!==f)?'enemy unit on the capital':'you don\'t hold every hex';return`<div class="brow off"><span><b>${star}${esc(k.name)}</b><br><small>Can't build: ${why}</small></span></div>`}
    return`<div class="brow"><span><b>${star}${esc(k.name)}</b></span>${['inf','arm'].map(t=>`<button class="chip" data-act="build" data-c="${k.cap}" data-t="${t}" ${edit&&canAfford(left,UNIT[t].cost)?'':'disabled'}>＋ ${UNIT[t].type}<br><small>${costStr(UNIT[t].cost)}</small></button>`).join('')}</div>`;
  }).join('')||'<p class="sub">You don\'t hold any country capitals.</p>';
  showOverlay(`<div class="sheet"><div class="sh-h"><h2>🏭 Build units</h2><button class="ghost" data-act="closeOv">✕</button></div>
  <div class="row eco" style="margin-top:4px">${ecoHTML(f)}</div>
  <p class="sub">Build at the capital of any country you hold completely, one unit per capital per turn. New units appear on the capital at the end of the turn and are paid for before this turn's income arrives. Numbers above show what's left after queued builds, and next turn's income.${edit?'':' Your orders are submitted, so builds are locked.'}</p>
  ${rows}<div class="row"><button class="primary" data-act="closeOv">Done</button></div></div>`,'','build');
}
function openMenu(){
  const pl=G.players.map((p,i)=>`<div class="prow ${p.alive?'':'out'}"><span class="dot" style="background:${pcol(i)}"></span><span class="pn">${esc(p.name)} ${p.uid===ME?'<span class="me">YOU</span>':p.ai?'🤖':p.uid?'':'<span class="rd">(open seat)</span>'}</span><span class="pm">${landCount(G,i)} hexes · ${G.units.filter(u=>u.f===i).length} units</span></div>`).join('');
  const cs=G.map.countries.map(k=>{const held=G.owner[k.cap];return`<div class="crow"><span class="sw" style="background:${pcol(k.f)}"></span><span class="cn">${esc(k.name)}</span><span class="cm">${k.f<0?'neutral':k.L?'large':'small'} · ${k.n} hexes · capital held by</span><span class="dot" style="background:${pcol(held)}"></span></div>`}).join('');
  const open=G.players.some(p=>!p.uid);
  showOverlay(`<div class="sheet"><div class="sh-h"><h2>Menu</h2><button class="ghost" data-act="closeOv">✕</button></div>
  <h3>Players</h3>${pl}
  <div class="row"><button data-act="share">Invite link</button>${open||!mySeats().length?'<button data-act="seats">Pick a seat</button>':''}</div>
  ${open&&G.phase==='orders'?'<div class="row"><button data-act="cpuSeats">🤖 Computer plays open seats</button></div>':''}
  ${(()=>{const vf=UI.as!=null?UI.as:mySeats()[0];if(vf==null||!G.players[vf].alive)return'';const net=supplyNet(G,vf);
    const own=G.map.countries.filter(k=>G.owner[k.cap]===vf);
    return`<h3>Economy — ${esc(G.players[vf].name)}</h3><div class="row eco" style="margin-top:0">${ecoHTML(vf)}</div>
    ${own.map(k=>{const on=net.has(k.cap);let inc={m:0,s:0,o:0,r:0};G.map.cells.forEach((c,i)=>{if(c.l&&c.c===G.map.cells[k.cap].c&&G.owner[i]===vf&&on){if(c.res){inc[RES[c.res].gives]+=RES[c.res].amt}if(c.cap>=0)inc.m+=CAPITAL_MONEY}});
      return`<div class="crow"><span class="cn">${esc(k.name)}</span><span class="cm">${on?Object.keys(inc).filter(x=>inc[x]).map(x=>`+${inc[x]}${CUR[x].icon}`).join(' '):'⛔ cut off — no income'}</span></div>`}).join('')}`})()}
  <h3>Map key</h3>
  <table class="key"><tr><th></th><th>Terrain</th><th>Inf MP</th><th>Armd MP</th></tr>
  <tr><td>—</td><td>Plains</td><td>1</td><td>1</td></tr><tr><td>▦</td><td>Urban</td><td>1</td><td>1</td></tr>
  <tr><td>▲</td><td>Mountains</td><td>2</td><td>2</td></tr><tr><td>≈</td><td>Swamp</td><td>2</td><td>3</td></tr></table>
  <p class="sub">🏭 factory +2💰 · 🛢 oil field +2🛢 · ⛏ mine +2⚙ · 🌿 rubber plantation +2🌿 · every country capital +${CAPITAL_MONEY}💰. A country only produces for you if you hold its capital and it connects to your ★ capital over your own land (or between your ports by sea). Production hexes, like capitals, can't be taken by encirclement.</p>
  <h3>Units &amp; battles</h3>
  <table class="key"><tr><th></th><th>MP</th><th>Str</th><th>HP</th><th>Retreat</th><th>Cost</th></tr>
  <tr><td>✕ Infantry</td><td>${UNIT.inf.mp}</td><td>${UNIT.inf.str}</td><td>${UNIT.inf.hp}</td><td>${retreatMp('inf')}</td><td>${costStr(UNIT.inf.cost)}</td></tr>
  <tr><td>⬭ Armour</td><td>${UNIT.arm.mp}</td><td>${UNIT.arm.str}</td><td>${UNIT.arm.hp}</td><td>${retreatMp('arm')}</td><td>${costStr(UNIT.arm.cost)}</td></tr></table>
  <p class="sub">When enemies make contact, both stop and a battle starts. Every step, each unit in battle hits the weakest enemy it's touching for about its strength (between half and 1½×), and units at 0 HP are destroyed. Armour gets +50% on plains; infantry gets +50% against armour in mountains or urban hexes. While a battle is going, each turn lasts at least ${MIN_BATTLE_STEPS} steps. Units in battle can't move except to retreat (half MP), and retreating units don't hit back. The bar under each unit shows its HP.</p>
  <p class="sub">Infantry ✕ has 3 MP and controls only its own hex. Armour ⬭ has 5 MP and controls its hex plus the hexes around it. Grey land is neutral: no one owns it until a unit moves through. ★ faction capital (lose it and you're out) · ● country capital · ⚓ port · ⚔ battle in progress. On the score bar, ✓ means that player's orders are in, … means they're still planning, and 🤖 is a computer player.</p>
  <h3>Countries</h3>${cs}
  <h3>War log</h3><div class="log">${G.log.slice(-80).reverse().map(logLine).join('')}</div>
  <div class="row"><button data-act="home">All my games</button><button data-act="openSetup">New game</button></div>
  <div class="row"><button class="primary" data-act="closeOv">Close</button></div></div>`,'','menu');
}
function openSeats(){
  const prev=$('myname')?$('myname').value:LS.get('frontline.name','');
  const rows=G.players.map((p,i)=>p.uid
    ?`<div class="prow"><span class="dot" style="background:${pcol(i)}"></span><span class="pn">${esc(p.name)}</span>${p.uid===ME?'<span class="me">YOU</span>':p.ai?`<span class="pm">🤖 computer</span><button class="chip" data-act="reclaim" data-i="${i}">Take over</button>`:`<span class="pm">taken</span><button class="chip" data-act="reclaim" data-i="${i}">It's me</button>`}</div>`
    :`<button class="seat" data-act="claim" data-i="${i}" style="--pc:${pcol(i)}"><span class="dot" style="background:${pcol(i)}"></span><span><b>${esc(PCOL[i].name)}</b> — open seat</span></button>`).join('');
  showOverlay(`<div class="sheet"><div class="sh-h"><h2>Pick your colour</h2><button class="ghost" data-act="watch">✕</button></div>
  <div class="sub">Type your name, then tap an open colour.</div>
  <input id="myname" class="pname" maxlength="16" placeholder="Your name" value="${esc(prev)}" style="border-left-color:var(--accent)">
  ${rows}<div class="row"><button data-act="watch">Just watch</button></div></div>`,'','seats');
}
function openReclaim(i){
  const ai=G.players[i].ai;
  showOverlay(`<div class="sheet"><h2>Take over ${esc(G.players[i].name)}?</h2>
  <p class="sub">${ai?"You'll give this colour's orders yourself from now on, instead of the computer.":`Only do this if ${esc(G.players[i].name)} is you on a different phone or browser. The old phone will stop being able to play this colour.`}</p>
  <div class="row"><button data-act="seats">Cancel</button><button class="danger" data-act="reclaimYes" data-i="${i}">Take over</button></div></div>`,'','reclaim');
}
async function claimSeat(i,force){
  const inp=$('myname');const name=((inp&&inp.value.trim())||LS.get('frontline.name','')||PCOL[i].name).slice(0,16);
  LS.set('frontline.name',name);
  let taken=false;
  const ok=await mutate(g=>{const p=g.players[i];if(p.uid&&p.uid!==ME&&!force){taken=true;return false}p.uid=ME;p.name=name;p.ai=false});
  if(!ok){if(taken)toast('Someone just took that colour');openSeats();return}
  rememberGame(GID);UI.ov=null;pickAs();hideOverlay();toast(`You are ${PCOL[i].name}`);
}
async function cpuSeats(){
  hideOverlay();
  const ok=await mutate(g=>{
    let n=0;g.players.forEach((p,f)=>{if(!p.uid&&p.alive){p.uid='ai';p.ai=true;p.name=PCOL[f].name+' (CPU)';n++}});
    if(!n)return false;glog(g,-1,`The computer took over ${n} open seat${n>1?'s':''}.`);advance(g);
  });
  if(ok)toast('The computer is playing the open seats');
}
function openShare(fresh){
  const link=gameLink(GID);
  showOverlay(`<div class="sheet"><div class="sh-h"><h2>${fresh?'Game created!':'Invite link'}</h2><button class="ghost" data-act="closeOv">✕</button></div>
  <p class="sub">Send this link to your friends. Each of them opens it and picks a colour. Anyone with the link can join, so only share it with people you're playing with.</p>
  <input class="linkbox" readonly value="${esc(link)}" onclick="this.select()">
  <div class="row"><button data-act="copy">Copy link</button>${navigator.share?'<button data-act="nshare">Share…</button>':''}</div>
  <div class="row"><button class="primary" data-act="closeOv">${fresh?'Go to the map':'Done'}</button></div></div>`,'','share');
}
async function copyLink(){try{await navigator.clipboard.writeText(gameLink(GID));toast('Link copied')}catch(e){toast('Press and hold the link to copy it')}}
async function nativeShare(){try{await navigator.share({title:'Warsea Conquest',text:'Join my Warsea Conquest game:',url:gameLink(GID)})}catch(e){}}
function openHome(){
  const gs=LS.get('frontline.games',[]);
  const list=gs.length?gs.map(g=>`<div class="grow"><span>Game from ${new Date(g.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${g.label?' · '+esc(g.label):''}</span><button class="chip" data-act="open" data-id="${esc(g.id)}">Open</button><button class="ghost" data-act="forget" data-id="${esc(g.id)}" aria-label="Forget">✕</button></div>`).join(''):'<p class="sub">No games on this phone yet.</p>';
  showOverlay(`<div class="sheet setup"><h1>WARSEA CONQUEST</h1><div class="sub">Three nations. Fifty turns. Most land wins.</div>
  <div class="row"><button class="primary" data-act="openSetup">Start a new game</button></div>
  <h3>Your games</h3>${list}
  <h3>Joining a friend?</h3><p class="sub">Just open the invite link they sent you.</p></div>`,'full','home');
}
function readSetup(){const n=$('myname');if(n)LS.set('frontline.name',n.value.trim().slice(0,16))}
function openSetup(){
  if(!SU.map){SU.map=genWorld(SU.seed);if(!SU.map){SU.seed=newSeed();SU.map=genWorld(SU.seed)}}
  const m=SU.map,land=m.cells.filter(c=>c.l).length;
  showOverlay(`<div class="sheet setup"><h1>NEW GAME</h1>
  <label class="h">Your name</label><input id="myname" class="pname" maxlength="16" placeholder="Your name" value="${esc(LS.get('frontline.name',''))}" style="border-left-color:${pcol(0)}">
  <label class="h">Opponents</label>
  <div class="row" style="margin-top:0"><button class="chip ${SU.cpu?'':'on'}" data-act="opp" data-v="friends">👥 Friends</button><button class="chip ${SU.cpu?'on':''}" data-act="opp" data-v="cpu">🤖 Computer</button></div>
  <div class="sub">${SU.cpu?'You play Red; the computer plays Blue and Green and submits its orders as soon as you submit yours.':"You'll play Red. Your two friends pick Blue and Green when they open the link."}</div>
  <svg id="prev" xmlns="${NS}" viewBox="${m.vb.join(' ')}"></svg>
  <div class="sub center">${land} land hexes · each nation starts with a large home country (★ capital) and two small neighbours, with six neutral countries (grey) in between. 🏭🛢⛏🌿 hexes produce resources.</div>
  <div class="row"><button data-act="reroll">🎲 New map</button><button class="primary" data-act="create" id="bCreate">Create game</button></div>
  <div class="row"><button data-act="${G?'closeOv':'home'}">${G?'Back to current game':'Back'}</button></div></div>`,'full','setup');
  buildWorldSVG($('prev'),m,true);
}
function randomId(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';crypto.getRandomValues(new Uint8Array(10)).forEach(v=>s+=a[v%a.length]);return s}
async function createGame(){
  const btn=$('bCreate');if(btn){btn.disabled=true;btn.textContent='Creating…'}
  const cpu=SU.cpu,g=newGame(SU.map,{cpu});g.players[0].uid=ME;g.players[0].name=LS.get('frontline.name','')||'Red';
  const id=randomId();g.id=id;
  try{
    const ok=await withTimeout(B.tx(id,cur=>cur?null:{v:2,rev:0,state:JSON.stringify(g)}),20000,'Creating the game');
    if(!ok)throw new Error('id clash');
  }catch(e){
    console.error(e);toast("Couldn't create the game — check your connection");
    if(btn){btn.disabled=false;btn.textContent='Create game'}
    const c=(e&&(e.code||e.message))||'';if(c)setTimeout(()=>toast('Error: '+c),2000);return;
  }
  history.replaceState(null,'','?g='+id+(MOCK?'&mock':''));
  GID=id;REV=-1;mapFor=null;R=null;DRAFT={};UI.watchOnly=false;UI.as=null;UI.rp=null;
  rememberGame(id,cpu?'vs computer':'3 players');SU.seed=newSeed();SU.map=null;
  applyRemote({v:2,rev:0,state:JSON.stringify(g)},true);
  startWatching();
  if(!cpu)openShare(true);else hideOverlay();
}
function showFatal(msg,e){
  const code=e?(e.code||e.message||String(e)):'';
  showOverlay(`<div class="fatal"><h2>😕 ${esc(msg)}</h2>${code?`<code>${esc(code)}</code>`:''}<div class="row" style="width:100%;max-width:360px"><button data-act="home">Home</button><button class="primary" data-act="retry">Try again</button></div></div>`,'full','fatal');
}

// ================= boot =================
async function getBackend(){
  if(MOCK)return MockBackend;
  if(window.FBBackend)return window.FBBackend;
  return withTimeout(new Promise(res=>addEventListener('fbready',()=>res(window.FBBackend),{once:true})),15000,'Loading Firebase');
}
async function boot(){
  showOverlay('<div class="fatal"><h2>Connecting…</h2></div>','full','loading');
  try{B=await getBackend();ME=await withTimeout(B.init(),15000,'Signing in')}
  catch(e){console.error(e);return showFatal("Couldn't connect to the game server. Check your internet connection.",e)}
  const id=Q.get('g');
  if(!id){openHome();return}
  GID=id;
  let d;
  try{d=await withTimeout(B.load(id),15000,'Loading the game')}
  catch(e){console.error(e);return showFatal("Couldn't load this game.",e)}
  if(!d)return showFatal('Game not found. Double-check the link.');
  rememberGame(id);
  UI.ov=null;$('overlay').className='hidden';
  applyRemote(d,true);
  startWatching();
}
boot();
</script>
