<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warsea Conquest</title>
<style>
:root{--bg:#0e141b;--panel:#151e28;--panel2:#1d2935;--line:#2a3846;--text:#e9eef3;--muted:#8fa0b2;--accent:#f2c14e;--danger:#d9533f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none}
#top{padding:7px 10px 7px;background:var(--panel);border-bottom:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:8px}
#ti{flex:1;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.rd{color:var(--muted);font-size:13px}
#net{font-size:12px;color:#ffb3a6}
.scores{display:flex;gap:6px;margin-top:6px}
.sc{flex:1;display:flex;align-items:center;gap:5px;background:var(--panel2);border-radius:6px;padding:4px 7px;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.sc i{width:10px;height:10px;border-radius:2px;flex:none}
.sc b{margin-left:auto}
.sc em{font-style:normal;color:var(--muted);min-width:10px;text-align:center}
.sc.as{box-shadow:inset 0 0 0 1.5px var(--accent)}
.sc.out{opacity:.45}
#mapwrap{flex:1;min-height:0;position:relative;background:#10283d}
#map{width:100%;height:100%;display:block;touch-action:none}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;min-height:0;padding:0;border-radius:10px;font-size:20px;background:rgba(21,30,40,.85)}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:9px 12px calc(10px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto}
.msg{font-size:16px;margin-bottom:4px}.msg.sm{font-size:14.5px}
.msg.big{font-size:19px;text-align:center;padding:6px 0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 4px}
.info{font-size:12.5px;color:#c9d4df;background:var(--panel2);border-radius:8px;padding:6px 9px;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.row>button{flex:1}
.lbl{color:var(--muted);font-size:13px;margin-right:2px}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
button:disabled{opacity:.38}
button.primary{background:var(--accent);color:#1a1300;border-color:transparent;font-weight:700}
button.danger{background:var(--danger);color:#fff;border-color:transparent;font-weight:700}
button.ghost{background:transparent;border-color:transparent;min-height:40px;padding:6px 10px;font-size:18px}
.row>button.chip{flex:0 0 auto;min-width:50px;padding:8px 12px;min-height:40px}
button.chip.on{background:#fff;color:#111;font-weight:700;border-color:#fff}
.chip .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.uchips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;margin:2px -2px 0}
.uchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;min-height:0;font-size:13px;border-radius:9px}
.uchip small{color:var(--muted);font-size:11px}
.uchip .usy{font-size:11px;opacity:.7}
.uchip.ord{border-color:#7f6a2a}
.uchip.on{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.uchip.on small{color:#4a3b06}
.ins{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:#d6dee6}
.rp button{font-size:17px}
.rpt{color:#d6dee6;min-height:36px}
#toast{position:fixed;left:50%;top:92px;transform:translate(-50%,-8px);background:rgba(0,0,0,.85);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.18s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#overlay{position:fixed;inset:0;background:rgba(5,8,12,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#overlay.hidden{display:none}
#overlay.full{background:var(--bg);align-items:stretch}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
#overlay.full .sheet{max-height:none;border-radius:0;height:100%;background:var(--bg)}
.sh-h{display:flex;align-items:center;justify-content:space-between}
.sh-h h2{margin:0;font-size:19px}
h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.crow,.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.crow .sw{width:12px;height:12px;border-radius:3px;flex:none}
.crow .cn,.prow .pn{flex:1}
.crow .cm,.prow .pm{color:var(--muted);font-size:12.5px}
.prow.out{opacity:.45;text-decoration:line-through}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.me{font-size:11px;color:#1a1300;background:var(--accent);border-radius:4px;padding:1px 5px;font-weight:700}
.log{max-height:34vh;overflow:auto}
.ll{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
.ll .dot{margin-top:3px;width:9px;height:9px}
.ll .r{color:var(--muted);min-width:28px}
table.key{border-collapse:collapse;font-size:13px;width:100%}
table.key td,table.key th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
table.key th{color:var(--muted);font-weight:600}
.setup h1{margin:6px 0 0;font-size:26px;letter-spacing:.14em;color:var(--accent);font-weight:800}
.setup label.h{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.pname{width:100%;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);border-left-width:6px;background:var(--panel2);color:var(--text);margin-bottom:6px;-webkit-user-select:text;user-select:text}
#prev{width:100%;height:42vh;display:block;margin-top:10px;background:#10283d;border-radius:10px}
.seat{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;text-align:left;border-left:6px solid var(--pc)}
.linkbox{width:100%;font:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);-webkit-user-select:all;user-select:all}
.grow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.grow span{flex:1}
.center{text-align:center}
.fatal{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px;width:100%}
.fatal code{color:var(--muted);font-size:12px;word-break:break-all}
/* map */
polygon.sea{fill:#132f48;stroke:#ffffff;stroke-opacity:.04;stroke-width:.5}
polygon.land{stroke:rgba(0,0,0,.25);stroke-width:.35}
.b-own{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.55;stroke-dasharray:1.2 1;pointer-events:none}
.b-cty{fill:none;stroke:#05080b;stroke-width:1.5;stroke-linecap:round;pointer-events:none}
.b-coast{fill:none;stroke:#cfe6f7;stroke-opacity:.55;stroke-width:.9;stroke-linecap:round;pointer-events:none}
.marks{pointer-events:none}
.m-fcap{fill:#f2c14e;stroke:#3a2c00;stroke-width:.4}
.m-cap{fill:#fff;stroke:#111;stroke-width:.5}
.clabel{display:none;font-size:3.3px;text-anchor:middle;fill:rgba(255,255,255,.8);font-weight:600;letter-spacing:.04em;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:.7px}
#map.zoomed .clabel{display:block}
.reach{fill:rgba(242,193,78,.16);stroke:#f2c14e;stroke-width:.7;pointer-events:none}
.plans{pointer-events:none}
.plan{fill:none;stroke:#f2c14e;stroke-width:1.2;stroke-dasharray:2.2 1.4;stroke-linecap:round;stroke-linejoin:round}
.pnum circle{fill:#f2c14e;stroke:#1a1300;stroke-width:.3}
.pnum text{font-size:2.9px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#1a1300}
.unitsG{pointer-events:none}
.fx{pointer-events:none}
.qb{font-size:3.6px;font-weight:800;text-anchor:middle;fill:#f2c14e;paint-order:stroke;stroke:#000;stroke-width:.7px}
.eco{gap:6px}.eco .cur{display:inline-flex;align-items:baseline;gap:2px;background:var(--panel2);border-radius:7px;padding:4px 7px;font-size:13px}
.eco .cur small{color:#7fd38a;font-size:11px}
.eco>button.chip{margin-left:auto;min-height:34px;padding:5px 10px}
.brow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.brow>span{flex:1}.brow small{color:var(--muted)}
.brow.off{opacity:.55}.brow .chip{min-height:0;padding:6px 9px;font-size:13px;line-height:1.2}
.clash{font-size:5px;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#b3261e;stroke-width:1.4px}
polygon.lake{fill:#1f5f8f;stroke:#16496e;stroke-width:.35}
polygon.mtn{fill:#0b0b0b;stroke:#000;stroke-width:.35}
.g-wave{fill:none;stroke:#7fb6dd;stroke-opacity:.6;stroke-width:.5;pointer-events:none}
.g-peak{fill:none;stroke:#5a5a5a;stroke-width:.7;stroke-linejoin:round;pointer-events:none}
.home{fill:rgba(242,193,78,.13);stroke:#f2c14e;stroke-width:.5;stroke-dasharray:1.4 1;pointer-events:none}
.tok rect{stroke:#fff;stroke-width:.5}
.tok text{font-size:5.8px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:.6px}
.tok.wait rect{stroke:#f2c14e;stroke-width:1.2}
.tok.sel rect{stroke:#fff;stroke-width:1.6}
.tok.ghost{opacity:.6}.tok.ghost rect{stroke-dasharray:1.2 .8}
.arrow{fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.loss{font-size:4.2px;font-weight:800;text-anchor:middle;fill:#ff8a73;paint-order:stroke;stroke:#000;stroke-width:.8px}
.capv{font-size:3.1px;font-weight:700;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:.6px;pointer-events:none}
.split{display:flex;align-items:center;gap:6px;margin-top:6px}
.split b{min-width:64px;text-align:center;font-size:15px}
.split button{min-height:38px;padding:6px 12px}
.olist{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:12.5px;color:#d6dee6;margin-top:4px}
.olist span{background:var(--panel2);border-radius:7px;padding:3px 4px 3px 8px;display:inline-flex;align-items:center;gap:4px}
.olist button{min-height:0;padding:0 6px;font-size:12px;border:none;background:transparent;color:var(--muted)}
.cash{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px}
.cash .chip{margin-left:auto}
</style>

<script type="module">
// ---- Firebase connection (loaded from Google) ----
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, doc, getDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCnCTuIaylYTKa14l6LEvEV9wUmzwoMutU",
  authDomain: "frontline-game-cf9e5.firebaseapp.com",
  projectId: "frontline-game-cf9e5",
  storageBucket: "frontline-game-cf9e5.firebasestorage.app",
  messagingSenderId: "562998491724",
  appId: "1:562998491724:web:09e7f06c54c35804c212e9"
};

let app, auth, db;
window.FBBackend = {
  async init() {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    const existing = await new Promise((res, rej) => { const un = onAuthStateChanged(auth, u => { un(); res(u); }, rej); });
    if (existing) return existing.uid;
    const cred = await signInAnonymously(auth);
    return cred.user.uid;
  },
  async load(id) {
    const s = await getDoc(doc(db, "games", id));
    return s.exists() ? s.data() : null;
  },
  async tx(id, fn) {
    const ref = doc(db, "games", id);
    return runTransaction(db, async t => {
      const s = await t.get(ref);
      const next = fn(s.exists() ? s.data() : null);
      if (!next) return false;
      t.set(ref, next);
      return true;
    });
  },
  watch(id, cb, onErr) {
    return onSnapshot(doc(db, "games", id), s => cb(s.exists() ? s.data() : null), e => { console.error(e); if (onErr) onErr(e); });
  }
};
window.dispatchEvent(new Event("fbready"));
</script>
<script>
'use strict';
// ================= constants =================
const S=10, SQ3=Math.sqrt(3), NS='http://www.w3.org/2000/svg';
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]]; // neighbour k sits across hex edge k (corners k..k+1)
const GRID={cols:21,rows:23};
const NEUTRALS_PER_PAIR=2;
const NF=3, MAX_TURNS=50;
const START_ARMIES=10;   // armies each faction places in its home country before turn 1
const ARMY_COST=10;      // $ per new army
const MOVE=3;            // hexes an army can move through its own land per turn
const ROUNDS=3;          // dice rounds per battle per turn
const INCOME={hex:1,cap:2,fcap:5}; // $ per turn: plain hex, country capital, own faction capital
const PCOL=[{name:'Red',h:4},{name:'Blue',h:214},{name:'Green',h:140}];
const SYL=['ka','ro','vel','dun','mar','sil','tor','bra','en','ost','gal','ny','hal','ver','ash','kel','mor','ith','lan','zar','fen','dor','sha','bel','tir','ul','gor','ri','cas','vor','pol','stav','kur','lein','mir','tal'];
const CEND=['ia','os','ar','and','ica','ea','heim','avia','istan','onia','mark','land'];

// ================= helpers =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const newSeed=()=>Math.floor(Math.random()*2147483647);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ROLL=()=>1+Math.floor(Math.random()*6); // one die; tests can replace it
function setRoll(fn){ROLL=fn}
function hexDist(M,a,b){const A=M.cells[a],B=M.cells[b],dq=A.q-B.q,dr=A.r-B.r;return(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2}
const nbs=(M,i)=>M.cells[i].nb.filter(j=>j>=0);
const isLand=(M,i)=>i>=0&&!!M.cells[i]&&M.cells[i].l===1;

// ================= world generation =================
// Each faction gets a home country at the back of the map with two small countries in front of it as a buffer.
// Six neutral countries fill the gaps. Inland lakes are placed first; clumps of impassable mountains are carved
// out afterwards. Every faction starts with exactly the same number of hexes, in one connected territory.
function genWorld(seed){
  for(let a=0;a<120;a++){const w=tryWorld(seed,a);if(w){w.seed=seed;return w}}
  return null;
}
function genWorldAny(seed){ // keeps trying new seeds until a map works
  for(let k=0;k<40;k++){const w=genWorld(seed);if(w)return w;seed=(seed*48271+11)%2147483647}
  return null;
}
function tryWorld(seed,attempt){
  const rnd=mulberry32((seed+attempt*1000003)>>>0), ri=n=>Math.floor(rnd()*n);
  const {cols,rows}=GRID, cells=[], idx=new Map(), K=(q,r)=>q*1000+r;
  for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
    const q=col-((row-(row&1))>>1); idx.set(K(q,row),cells.length);
    cells.push({q,r:row,col,row,x:+(S*SQ3*(col+0.5*(row&1))).toFixed(2),y:S*1.5*row,w:rnd(),c:-1,cap:-1,nb:null,ft:null});
  }
  cells.forEach(c=>c.nb=DIRS.map(([dq,dr])=>{const j=idx.get(K(c.q+dq,c.r+dr));return j===undefined?-1:j}));
  const NB=i=>cells[i].nb.filter(j=>j>=0);
  for(let k=0;k<3;k++){const nv=cells.map((c,i)=>{let s=c.w,n=1;for(const j of NB(i)){s+=cells[j].w;n++}return s/n});nv.forEach((v,i)=>cells[i].w=v)}
  const edge=c=>c.row<1||c.row>rows-2||c.col<1||c.col>cols-2;
  const hd=(a,b)=>{const A=cells[a],B=cells[b],dq=A.q-B.q,dr=A.r-B.r;return(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2};
  const center=Math.floor(rows/2)*cols+Math.floor(cols/2);
  const nearest=(x,y)=>{let b=-1,bd=1e9;cells.forEach((c,i)=>{if(edge(c)||c.c!==-1)return;const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;b=i}});return b};
  const C=[];
  // inland lakes first (c=-2); countries grow around them
  {const inner=i=>!edge(cells[i])&&hd(i,center)>=2&&hd(i,center)<=7&&cells[i].c===-1;
   const near=i=>NB(i).some(j=>cells[j].c===-2);
   const put=i=>{cells[i].c=-2;cells[i].ft='lake'};
   const nl=2+ri(2);
   for(let k=0;k<nl;k++){const o=cells.map((c,i)=>i).filter(i=>inner(i)&&!near(i)&&hd(i,center)<=4);if(!o.length)return null;
     const blob=[o[ri(o.length)]];put(blob[0]);const tg=4+ri(4);
     while(blob.length<tg){const fr=[...new Set(blob.flatMap(NB))].filter(j=>inner(j)&&hd(j,center)<=5);if(!fr.length)break;const j=fr[ri(fr.length)];put(j);blob.push(j)}}
  }
  const addCountry=(f,L,seedCell,target)=>{const id=C.length;C.push({f,L,target,cells:[seedCell]});cells[seedCell].c=id;return id};
  // home countries (ids 0-2) at the back; small countries (ids 3-8) in front of them
  const a0=rnd()*Math.PI*2, Rh=(6.0+rnd()*0.5)*S*SQ3, Rs=(3.5+rnd()*0.4)*S*SQ3, cx=cells[center].x, cy=cells[center].y;
  const at=(r,a)=>nearest(cx+r*Math.cos(a),cy+r*Math.sin(a));
  const TOT=34+ri(7), split=[]; // every faction gets TOT hexes, split differently between its three countries
  for(let f=0;f<NF;f++){const lo=Math.max(15,TOT-24),hi=Math.min(20,TOT-16),h=lo+ri(hi-lo+1),r=TOT-h,s1lo=Math.max(8,r-12),s1hi=Math.min(12,r-8),s1=s1lo+ri(s1hi-s1lo+1);split.push([h,s1,r-s1])}
  for(let f=0;f<NF;f++){const s=at(Rh,a0+f*2*Math.PI/3);if(s<0)return null;addCountry(f,1,s,split[f][0])}
  for(let f=0;f<NF;f++)for(let k=0;k<2;k++){const s=at(Rs,a0+f*2*Math.PI/3+(k?1:-1)*0.42);if(s<0)return null;addCountry(f,0,s,split[f][1+k])}
  // neutral countries seeded in the gaps between each pair of factions
  const neutralIds=[];
  for(let a=0;a<NF;a++){const b=(a+1)%NF,A=cells[C[a].cells[0]],Bc=cells[C[b].cells[0]];
    const mx=(A.x+Bc.x)/2,my=(A.y+Bc.y)/2,dx=Bc.x-A.x,dy=Bc.y-A.y,L=Math.hypot(dx,dy)||1,px=-dy/L,py=dx/L;
    for(let k=0;k<NEUTRALS_PER_PAIR;k++){const off=(k-(NEUTRALS_PER_PAIR-1)/2)*2.6*S*SQ3+(rnd()-0.5)*S;
      const seed=nearest(mx+px*off,my+py*off);if(seed<0)return null;neutralIds.push(addCountry(-1,0,seed,8+ri(5)))}}
  const frontier=id=>{const s=new Set();for(const i of C[id].cells)for(const j of NB(i))if(cells[j].c===-1&&!edge(cells[j]))s.add(j);return[...s]};
  // faction countries grow first (homes lean outward, small countries lean toward their home); neutrals fill in after
  const grow=(ids,soft)=>{
    let act=ids.slice();
    while(act.length){
      for(const id of act.slice()){
        const k=C[id]; if(k.cells.length>=k.target){act=act.filter(x=>x!==id);continue}

    else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>8)drag.moved=true;
      if(drag.moved){const r=mapRect();VIEW.x=drag.vx-dx*VIEW.w/r.width;VIEW.y=drag.vy-dy*VIEW.h/r.height;applyView()}}
  });
  const up=e=>{
    if(!PT.has(e.pointerId))return;PT.delete(e.pointerId);
    if(PT.size===0){
      if(drag&&!drag.moved&&e.type==='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest&&t.closest('[data-c]');if(c)onCellTap(+c.dataset.c)}
      drag=null;pinch=null;
    }else if(PT.size===1){pinch=null;const p=[...PT.values()][0];drag={x:p.x,y:p.y,vx:VIEW.x,vy:VIEW.y,moved:true}}
  };
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY>0?1.15:1/1.15)},{passive:false});
  if(window.ResizeObserver)new ResizeObserver(()=>applyView()).observe($('mapwrap'));
})();

const Q=new URLSearchParams(location.search), MOCK=Q.has('mock');
let G=null,R=null,B=null,ME=null,GID=null,REV=-1,unwatch=null,mapFor=null;
const UI={ov:null,watchOnly:false,as:null,sel:null,cnt:1,info:null,rp:null,busy:false};
let DRAFT={},BLD={},PLC={};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// Test-only stand-in for Firebase (used when the link has ?mock). Shares games between tabs of one browser.
const MockBackend={
  _l:[],
  async init(){let u=sessionStorage.getItem('mockuid');if(!u){u='u'+Math.random().toString(36).slice(2,9);sessionStorage.setItem('mockuid',u)}return u},
  async load(id){const s=localStorage.getItem('mock:'+id);return s?JSON.parse(s):null},
  async tx(id,fn){await new Promise(r=>setTimeout(r,5));const s=localStorage.getItem('mock:'+id);const n=fn(s?JSON.parse(s):null);if(!n)return false;const str=JSON.stringify(n);localStorage.setItem('mock:'+id,str);this._l.filter(x=>x[0]===id).forEach(x=>setTimeout(()=>x[1](JSON.parse(str))));return true},
  watch(id,cb){const h=e=>{if(e.key==='mock:'+id&&e.newValue)cb(JSON.parse(e.newValue))};addEventListener('storage',h);const ent=[id,cb];this._l.push(ent);this.load(id).then(cb);return()=>{removeEventListener('storage',h);this._l=this._l.filter(x=>x!==ent)}}
};

const mySeats=()=>G?G.players.map((p,i)=>p.uid===ME?i:-1).filter(i=>i>=0):[];

const withTimeout=(p,ms,what)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(what+' timed out')),ms))]);
function setNet(s){$('net').textContent=s==='off'?'⚠ Offline':''}

async function mutate(fn){
  if(!B||!GID)return false;
  try{
    const ok=await B.tx(GID,cur=>{if(!cur)return null;const g=JSON.parse(cur.state);if(fn(g)===false)return null;return{v:3,rev:cur.rev+1,state:JSON.stringify(g)}});
    setNet('ok');
    if(ok){const d=await B.load(GID);applyRemote(d,false)}
    return ok;
  }catch(e){console.error(e);setNet('off');toast("Couldn't reach the server — try again");return false}
}
function applyRemote(d,force){
  if(!d)return;
  if(!force&&d.rev<=REV)return;
  let g;try{g=JSON.parse(d.state)}catch(e){return}
  if(g.v!==3){showFatal("This game was made with an older version of Warsea Conquest, so it can't be opened any more. Start a new game.");return}
  const prev=G&&G.id===g.id?G.turn+':'+G.phase:null;
  G=g;REV=d.rev;
  if(mapFor!==GID||!R){R=buildWorldSVG($('map'),G.map,false);mapFor=GID;requestAnimationFrame(fitView)}
  if(prev!==null&&prev!==G.turn+':'+G.phase){DRAFT={};BLD={};PLC={};UI.sel=null;UI.rp=null;stopPlay()}
  pickAs();render();afterSync();
}
function startWatching(){if(unwatch)unwatch();unwatch=B.watch(GID,d=>applyRemote(d,false),()=>setNet('off'))}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&B&&GID)B.load(GID).then(d=>applyRemote(d,false)).catch(()=>{})});
function rememberGame(id,label){const gs=LS.get('frontline.games',[]).filter(x=>x.id!==id);gs.unshift({id,t:Date.now(),label:label||''});LS.set('frontline.games',gs.slice(0,20))}
function needsMe(){return G&&G.phase!=='over'&&mySeats().some(f=>G.players[f].alive&&!G.submitted[f])}
function afterSync(){
  if(!G)return;

// ================= drafts (kept on this phone until submitted) =================
const dkey=f=>`wc.d.${GID}.${G.turn}.${f}`;
function getDraft(f){
  if(!DRAFT[f]){const src=G.submitted[f]?G.orders[f]:LS.get(dkey(f),[]);
    DRAFT[f]=(src||[]).filter(o=>o&&Array.isArray(o.path)&&o.path.length&&o.n>0).map(o=>({from:o.from,n:o.n,path:o.path.slice(),r:!!o.r}))}
  return DRAFT[f];
}
const saveDraft=f=>LS.set(dkey(f),getDraft(f));
function getBuilds(f){
  if(!BLD[f]){const src=G.submitted[f]?G.recruits[f]:LS.get(dkey(f)+'.b',[]);BLD[f]=(src||[]).filter(b=>b&&b.n>0&&G.map.cells[b.c]).map(b=>({c:b.c,n:b.n}))}
  return BLD[f];
}
const saveBuilds=f=>LS.set(dkey(f)+'.b',getBuilds(f));
function getPlace(f){
  if(!PLC[f]){const src=G.submitted[f]?G.place[f]:LS.get(dkey(f)+'.p',[]);PLC[f]=(src||[]).filter(p=>p&&p.n>0).map(p=>({c:p.c,n:p.n}))}
  return PLC[f];
}
const savePlace=f=>LS.set(dkey(f)+'.p',getPlace(f));
const placed=f=>getPlace(f).reduce((s,p)=>s+p.n,0);
const queued=f=>getBuilds(f).reduce((s,b)=>s+b.n,0);
const sentFrom=(f,h,retreat)=>getDraft(f).reduce((s,o)=>s+(o.from===h&&!!o.r===!!retreat?o.n:0),0);
let BSET=null;const inBattle=(f,h)=>(BSET||(BSET=battleSet(G))).has(f+':'+h);
// armies at a hex that haven't been given orders (armies in battle hold by default, so they don't count)
function waitingAt(f,h){if(inBattle(f,h))return 0;return armiesAt(G,h,f)-sentFrom(f,h,false)}
function waitingHexes(f){const s=[];G.st.forEach(a=>{if(a.f===f&&waitingAt(f,a.c)>0)s.push(a.c)});return s.sort((a,b)=>a-b)}
const waitingTotal=f=>waitingHexes(f).reduce((s,h)=>s+waitingAt(f,h),0);
// how many armies the selected hex can still send
function canSend(f,h){return inBattle(f,h)?armiesAt(G,h,f)-sentFrom(f,h,true):waitingAt(f,h)}

const canPlot=()=>!!(G&&(G.phase==='orders'||G.phase==='place')&&UI.as!=null&&G.players[UI.as].alive&&G.players[UI.as].uid===ME&&!G.submitted[UI.as]&&!UI.rp&&!UI.busy);
function pickAs(){
  const s=mySeats().filter(f=>G.players[f].alive);
  if(UI.as!=null&&s.includes(UI.as)&&!G.submitted[UI.as])return;
  const open=s.find(f=>!G.submitted[f]);
  UI.as=open!=null?open:(s.includes(UI.as)?UI.as:(s[0]!=null?s[0]:null));
}
function select(h){const f=UI.as;UI.sel=h;UI.cnt=canSend(f,h);UI.info=h}
function onCellTap(i){
  if(!G)return;
  UI.info=i;
  if(!canPlot()){render();return}
  const f=UI.as;
  if(G.phase==='place'){
    if(!homeHexes(G,f).includes(i)){toast('Place armies in your home country (outlined in gold)');render();return}
    if(placed(f)>=START_ARMIES){toast(`All ${START_ARMIES} armies are placed — tap Undo to move one`);render();return}
    const pl=getPlace(f),e=pl.find(p=>p.c===i);if(e)e.n++;else pl.push({c:i,n:1});savePlace(f);render();return;
  }
  if(UI.sel!=null&&i!==UI.sel){
    const ret=inBattle(f,UI.sel),rr=reachFor(G,f,UI.sel,ret);
    if(rr.dist.has(i)){
      const n=Math.max(1,Math.min(UI.cnt,canSend(f,UI.sel)));
      getDraft(f).push({from:UI.sel,n,path:pathTo(rr,UI.sel,i),r:ret});saveDraft(f);
      if(canSend(f,UI.sel)>0)UI.cnt=canSend(f,UI.sel);else UI.sel=null;
      render();return;
    }
  }
  if(i===UI.sel){UI.sel=null;render();return}
  if(armiesAt(G,i,f)>0&&canSend(f,i)>0){select(i);render();return}
  if(armiesAt(G,i,f)>0&&inBattle(f,i)){toast('These armies are in battle. They hold unless you order a retreat.')}
  else if(UI.sel!=null)toast('Out of reach — tap a highlighted hex');
  render();
}
async function submitOrders(){
  const f=UI.as,turn=G.turn,phase=G.phase;
  const d=getDraft(f).map(o=>({from:o.from,n:o.n,path:o.path.slice(),r:o.r})),bl=getBuilds(f).map(b=>({c:b.c,n:b.n})),pl=getPlace(f).map(p=>({c:p.c,n:p.n}));
  UI.busy=true;UI.sel=null;render();
  const ok=await mutate(g=>{
    if(g.phase!==phase||g.turn!==turn||!g.players[f].alive||g.players[f].uid!==ME)return false;
    if(phase==='place')g.place[f]=pl;else{g.orders[f]=d;g.recruits[f]=bl}
    g.submitted[f]=true;advance(g);
  });
  UI.busy=false;
  if(!ok)toast("Couldn't submit — the turn may have changed");
  pickAs();render();afterSync();
}
async function editOrders(){
  const f=UI.as,turn=G.turn,phase=G.phase;
  UI.busy=true;render();
  const ok=await mutate(g=>{if(g.turn!==turn||g.phase!==phase||!g.submitted[f]||g.players[f].uid!==ME)return false;g.submitted[f]=false});
  UI.busy=false;
  if(ok){saveDraft(f);saveBuilds(f);savePlace(f)}else toast('Too late — everyone had already submitted');
  render();
}

// ================= replay =================
let playT=0;
function stopPlay(){clearInterval(playT);playT=0;if(UI.rp)UI.rp.playing=false}
function startReplay(){LS.set('wc.seen.'+GID,G.replay.turn);UI.rp={i:0,playing:false};UI.sel=null;hideOverlay();playPause()}
function playPause(){
  if(!UI.rp)return;
  if(UI.rp.playing){stopPlay();render();return}
  const n=G.replay.frames.length;
  if(UI.rp.i>=n-1)UI.rp.i=0;
  UI.rp.playing=true;
  playT=setInterval(()=>{if(!UI.rp){stopPlay();return}if(UI.rp.i>=n-1){stopPlay();render();return}UI.rp.i++;render()},1100);
  render();
}
function rpStep(d){if(!UI.rp)return;stopPlay();const n=G.replay.frames.length;UI.rp.i=Math.max(0,Math.min(n-1,UI.rp.i+d));render()}
function rpView(){
  const r=G.replay,i=UI.rp.i,owner=r.so.slice();
  for(let k=0;k<=i;k++)(r.frames[k].fl||[]).forEach(([h,o])=>owner[h]=o);
  const fr=r.frames[i];
  return{owner,armies:fr.st.map(([f,c,n])=>({f,c,n})),fr};
}
function rpText(fr){
  const r=G.replay,P=f=>G.players[f].name,cn=h=>esc(G.map.countries[G.map.cells[h].c].name);
  if(fr.k==='start')return`Start of turn ${r.turn}.`;
  if(fr.k==='retreat')return'Retreats: '+fr.mv.map(([a,b,f,n])=>`${P(f)} ${n} from ${cn(a)}`).join(' · ');
  if(fr.k==='move'){const p=[];const by={};(fr.mv||[]).forEach(([a,b,f,n])=>{by[f]=(by[f]||0)+1});
    Object.keys(by).forEach(f=>p.push(`${P(f)}: ${by[f]} group${by[f]>1?'s':''} move`));
    (fr.cross||[]).forEach(([a,fa,b,fb])=>p.push(`⚔ ${P(fa)} and ${P(fb)} collide between ${cn(a)} and ${cn(b)}`));
    (fr.el||[]).forEach(f=>p.push(`☠ ${P(f)} eliminated`));
    return'Movement · '+(p.join(' · ')||'…')}
  if(fr.k==='battle'){const l={};(fr.hits||[]).forEach(([h,f,n])=>{l[f]=(l[f]||0)+n});
    const p=Object.keys(l).map(f=>`${P(f)} −${l[f]}`);(fr.el||[]).forEach(f=>p.push(`☠ ${P(f)} eliminated`));
    return`Battle round ${fr.round}: `+(p.join(' · ')||'no losses')}
  if(fr.k==='end'){const p=[];const enc=(fr.fl||[]).length;if(enc)p.push(`${enc} encircled hex${enc>1?'es':''} changed hands`);
    const b={};(fr.built||[]).forEach(([f,c,n])=>{b[f]=(b[f]||0)+n});Object.keys(b).forEach(f=>p.push(`${P(f)} recruited ${b[f]}`));
    return'End of turn. '+(p.join(' · ')||'')}
  return'';
}

// ================= input =================
let toastT=0;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function act(a,ds){
  const f=UI.as;
  switch(a){
    case 'next':{if(!canPlot())return;const hs=waitingHexes(f);if(!hs.length)return;const k=hs.findIndex(h=>h>(UI.sel==null?-1:UI.sel));const h=hs[k<0?0:k];select(h);panTo(h);render();return}
    case 'done':UI.sel=null;render();return;
    case 'less':UI.cnt=Math.max(1,UI.cnt-1);render();return;
    case 'more':if(UI.sel!=null)UI.cnt=Math.min(canSend(f,UI.sel),UI.cnt+1);render();return;
    case 'all':if(UI.sel!=null)UI.cnt=canSend(f,UI.sel);render();return;
    case 'delord':{if(!canPlot())return;getDraft(f).splice(+ds.k,1);saveDraft(f);if(UI.sel!=null)UI.cnt=Math.max(1,canSend(f,UI.sel));render();return}
    case 'undo':{if(!canPlot())return;
      if(G.phase==='place'){const pl=getPlace(f),last=pl[pl.length-1];if(last){last.n--;if(!last.n)pl.pop()}savePlace(f);render();return}
      getDraft(f).pop();saveDraft(f);if(UI.sel!=null)UI.cnt=Math.max(1,canSend(f,UI.sel));render();return}
    case 'clear':if(!canPlot())return;if(G.phase==='place'){getPlace(f).length=0;savePlace(f)}else{getDraft(f).length=0;saveDraft(f)}UI.sel=null;render();return;
    case 'submit':if(canPlot())submitOrders();return;
    case 'edit':editOrders();return;
    case 'as':UI.as=+ds.f;UI.sel=null;render();return;
    case 'openBuild':if(G&&UI.as!=null)openBuild();return;
    case 'rec+':{if(!canPlot())return;const c=+ds.c,b=getBuilds(f);if((queued(f)+1)*ARMY_COST>G.money[f])return;const e=b.find(x=>x.c===c);if(e)e.n++;else b.push({c,n:1});saveBuilds(f);openBuild();render();return}
    case 'rec-':{if(!canPlot())return;const c=+ds.c,b=getBuilds(f),e=b.find(x=>x.c===c);if(e){e.n--;if(!e.n)b.splice(b.indexOf(e),1)}saveBuilds(f);openBuild();render();return}
    case 'zin':{const r=mapRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.4);return}
    case 'zout':{const r=mapRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4);return}
    case 'zfit':fitView();return;
    case 'replay':if(G&&G.replay)startReplay();return;
    case 'skipReplay':LS.set('wc.seen.'+GID,G.replay.turn);hideOverlay();return;
    case 'rpPlay':playPause();return;
    case 'rpPrev':rpStep(-1);return;
    case 'rpNext':rpStep(1);return;
    case 'rpStart':stopPlay();UI.rp.i=0;render();return;
    case 'rpEnd':stopPlay();UI.rp.i=G.replay.frames.length-1;render();return;
    case 'rpClose':stopPlay();UI.rp=null;render();afterSync();return;
    case 'menu':if(G)openMenu();return;
    case 'closeOv':hideOverlay();return;
    case 'watch':UI.watchOnly=true;hideOverlay();return;
    case 'seats':UI.watchOnly=false;openSeats();return;
    case 'claim':claimSeat(+ds.i,false);return;
    case 'reclaim':openReclaim(+ds.i);return;
    case 'reclaimYes':claimSeat(+ds.i,true);return;
    case 'share':openShare();return;
    case 'copy':copyLink();return;
    case 'nshare':nativeShare();return;
    case 'home':location.href=location.pathname+(MOCK?'?mock':'');return;
    case 'open':location.href=gameLink(ds.id);return;
    case 'forget':LS.set('frontline.games',LS.get('frontline.games',[]).filter(x=>x.id!==ds.id));openHome();return;
    case 'openSetup':openSetup();return;
    case 'reroll':readSetup();SU.seed=newSeed();SU.map=null;openSetup();return;
    case 'opp':readSetup();SU.cpu=ds.v==='cpu';openSetup();return;
    case 'cpuSeats':cpuSeats();return;
    case 'create':readSetup();createGame();return;
    case 'retry':location.reload();return;
  }
}

// ================= rendering =================
function render(){
  if(!G||!R)return;
  BSET=null;
  const M=G.map;
  let owner=G.owner,armies=G.st.map(a=>({f:a.f,c:a.c,n:a.n})),links=G.links||[],rv=null;
  if(UI.rp){rv=rpView();owner=rv.owner;armies=rv.armies;links=[]}
  M.cells.forEach((c,i)=>{if(c.l)R.poly[i].style.fill=ownerFill(owner[i],c.c,M)});
  let d='';M.cells.forEach((c,i)=>{if(!c.l)return;for(let k=0;k<6;k++){const j=c.nb[k];if(j>i&&M.cells[j].l&&owner[j]!==owner[i])d+=edgeSeg(c,k)}});R.own.setAttribute('d',d);
  R.paths.innerHTML='';R.fx.innerHTML='';
  const plotting=!UI.rp&&G.phase!=='over'&&UI.as!=null&&G.players[UI.as]&&G.players[UI.as].uid===ME&&G.players[UI.as].alive;
  let hd='',rd='';
  if(plotting&&G.phase==='place'){
    if(!G.submitted[UI.as])homeHexes(G,UI.as).forEach(h=>hd+=`M${hexPts(M.cells[h]).replace(/ /g,'L')}Z`);
    armies=getPlace(UI.as).map(p=>({f:UI.as,c:p.c,n:p.n}));
  }else if(plotting&&G.phase==='orders'){
    const f=UI.as,col=pcol(f);
    // origin tokens show what stays; ghosts at the end of each arrow show what's on the way
    const sent={};getDraft(f).forEach(o=>{sent[o.from]=(sent[o.from]||0)+o.n});
    armies=armies.map(a=>a.f===f?{...a,n:a.n-(sent[a.c]||0),wait:waitingAt(f,a.c)>0,sel:a.c===UI.sel,keep:true}:a);
    getDraft(f).forEach(o=>{arrow([o.from,...o.path],col,R.paths);armies.push({f,c:o.path[o.path.length-1],n:o.n,ghost:true})});
    armies=armies.filter(a=>a.n>0||a.sel);
    if(UI.sel!=null&&canPlot()){const rr=reachFor(G,f,UI.sel,inBattle(f,UI.sel));rr.dist.forEach((v,h)=>{if(h!==UI.sel)rd+=`M${hexPts(M.cells[h]).replace(/ /g,'L')}Z`})}
    getBuilds(f).forEach(b=>{const c=M.cells[b.c];el('text',{x:c.x,y:c.y-8.4,class:'qb'},R.paths).textContent='＋'+b.n})
  }
  R.home.setAttribute('d',hd);R.reach.setAttribute('d',rd);
  drawArmies(armies);
  // battles: ⚔ on hexes with more than one faction, and on borders where armies collided
  const fs={};armies.forEach(a=>{if(a.ghost||a.n<=0)return;(fs[a.c]=fs[a.c]||new Set()).add(a.f)});
  Object.entries(fs).forEach(([h,s])=>{if(s.size>1){const c=M.cells[h];el('text',{x:c.x,y:c.y-5.4,class:'clash'},R.fx).textContent='⚔'}});
  links.forEach(([a,fa,b,fb])=>{if(armiesAt(G,a,fa)>0&&armiesAt(G,b,fb)>0){const A=M.cells[a],Bc=M.cells[b];el('text',{x:(A.x+Bc.x)/2,y:(A.y+Bc.y)/2+1.6,class:'clash'},R.fx).textContent='⚔'}});
  if(rv){
    (rv.fr.mv||[]).forEach(([a,b,f])=>arrow([a,b],pcol(f),R.paths));
    (rv.fr.cross||[]).forEach(([a,fa,b,fb])=>{const A=M.cells[a],Bc=M.cells[b];el('text',{x:(A.x+Bc.x)/2,y:(A.y+Bc.y)/2+1.6,class:'clash'},R.fx).textContent='⚔'});
    const k={};(rv.fr.hits||[]).forEach(([h,f,n])=>{const c=M.cells[h],j=k[h]=(k[h]||0)+1;el('text',{x:c.x+3.5,y:c.y-4-j*3.6,class:'loss',fill:pcol(f)},R.fx).textContent='−'+n});
  }
  renderTop();renderPanel();
}
function renderTop(){

function randomId(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';crypto.getRandomValues(new Uint8Array(10)).forEach(v=>s+=a[v%a.length]);return s}
async function createGame(){
  const btn=$('bCreate');if(btn){btn.disabled=true;btn.textContent='Creating…'}
  const cpu=SU.cpu,g=newGame(SU.map,{cpu});g.players[0].uid=ME;g.players[0].name=LS.get('frontline.name','')||'Red';
  const id=randomId();g.id=id;
  try{
    const ok=await withTimeout(B.tx(id,cur=>cur?null:{v:3,rev:0,state:JSON.stringify(g)}),20000,'Creating the game');
    if(!ok)throw new Error('id clash');
  }catch(e){
    console.error(e);toast("Couldn't create the game — check your connection");
    if(btn){btn.disabled=false;btn.textContent='Create game'}
    const c=(e&&(e.code||e.message))||'';if(c)setTimeout(()=>toast('Error: '+c),2000);return;
  }
  history.replaceState(null,'','?g='+id+(MOCK?'&mock':''));
  GID=id;REV=-1;mapFor=null;R=null;DRAFT={};BLD={};PLC={};UI.watchOnly=false;UI.as=null;UI.rp=null;
  rememberGame(id,cpu?'vs computer':'3 players');SU.seed=newSeed();SU.map=null;
  applyRemote({v:3,rev:0,state:JSON.stringify(g)},true);
  startWatching();
  if(!cpu)openShare(true);else hideOverlay();
}

async function boot(){
  showOverlay('<div class="fatal"><h2>Connecting…</h2></div>','full','loading');
  try{B=await getBackend();ME=await withTimeout(B.init(),15000,'Signing in')}
  catch(e){console.error(e);return showFatal("Couldn't connect to the game server. Check your internet connection.",e)}
  const id=Q.get('g');
  if(!id){openHome();return}
  GID=id;
  let d;
  try{d=await withTimeout(B.load(id),15000,'Loading the game')}
  catch(e){console.error(e);return showFatal("Couldn't load this game.",e)}
  if(!d)return showFatal('Game not found. Double-check the link.');
  rememberGame(id);
  UI.ov=null;$('overlay').className='hidden';
  applyRemote(d,true);
  startWatching();
}
boot();
</script>
</body>
